# Jetta — Codemagic CI/CD yapılandırması
# (Yakınlık'ta kanıtlanmış akışla birebir aynı kalıp; Jetta repo kökünde
#  olduğu için "cd mobile" yok, native eklenti olmadığı için pod install yok.)
#
# 2 workflow:
#   1. android-apk      → main'e her push'ta release APK üretir.
#   2. ios-testflight   → main'e her push'ta otomatik imza + TestFlight upload.
#
# Otomatik kod imzalama: mevcut Apple Distribution sertifikası
# CERTIFICATE_PRIVATE_KEY ile EŞLEŞTİRİLEREK getirilir (yeni sertifika
# YARATILMAZ → limit dolmaz). --create yalnızca eksikse bundle ID kaydını
# ve provisioning profile'ı oluşturur. `xcode-project use-profiles`
# export_options.plist'i otomatik üretir; elle plist yazmıyoruz.
#
# Codemagic UI'da gerekenler:
#   - Integrations → App Store Connect: "jetta-asc-api-key" (bağlı ✓)
#   - Environment variables → group "jetta_signing":
#       CERTIFICATE_PRIVATE_KEY (secure) — distribution sertifikasının
#       private key'i (PEM). Yakınlık ile AYNI Apple hesabı/takımı
#       kullanılıyorsa oradaki değerin AYNISINI kullanın.

workflows:
  # ─── ANDROID APK ─────────────────────────────────────────────
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
      # Play Store imzası için keystore eklediğinizde bu bloğu açın:
      # android_signing:
      #   - jetta_keystore
    cache:
      cache_paths:
        - $HOME/.pub-cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - nazantrhs@gmail.com
        notify:
          success: true
          failure: true

  # ─── iOS TESTFLIGHT ──────────────────────────────────────────
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Codemagic UI → Teams → Integrations → App Store Connect ile
      # aynı isimde tanımlı (ekran görüntüsünde bağlı görünen anahtar).
      app_store_connect: jetta-asc-api-key
    environment:
      flutter: stable
      # Apple zorunluluğu (2026): App Store yüklemeleri güncel iOS SDK
      # (Xcode 26+) ile derlenmiş olmalı.
      xcode: latest
      cocoapods: default
      # CERTIFICATE_PRIVATE_KEY bu gruptan gelir (Codemagic UI'da secure
      # env var). Mevcut Apple Distribution sertifikasının private key'i —
      # yeni sertifika yaratılmasını önler.
      groups:
        - jetta_signing
      vars:
        # Bunlar gizli değil — doğrudan gömülü.
        BUNDLE_ID: 'com.jetta.jetta'
        # App Store Connect'te Jetta uygulamasının NUMERİK Apple ID'si:
        # ASC → My Apps → Jetta → App Information → Apple ID.
        # Uygulama ASC'de henüz oluşturulmadıysa önce oluşturun, ID'yi buraya yazın.
        APP_STORE_APPLE_ID: 'JETTA_ASC_APPLE_ID_BURAYA'
    cache:
      cache_paths:
        - $HOME/.pub-cache
    triggering:
      events:
        - push
      branch_patterns:
        # main'e her push → otomatik iOS build + TestFlight upload.
        - pattern: main
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Set up code signing (reuse existing distribution cert)
        script: |
          # API key, integrations.app_store_connect üzerinden otomatik gelir.
          keychain initialize

          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "HATA: CERTIFICATE_PRIVATE_KEY env var tanımlı değil."
            echo "Distribution sertifikasının private key'ini (PEM) Codemagic'e"
            echo "secure env var olarak ekle (group: jetta_signing)."
            exit 1
          fi

          # Mevcut distribution sertifikasını private key ile EŞLEŞTİREREK getir.
          # Key zaten var olan bir sertifikaya ait olduğundan YENİ SERTİFİKA
          # YARATILMAZ → limit dolmaz, diğer uygulamalar/sertifikalar etkilenmez.
          # --create yalnızca eksikse bundle ID kaydını ve provisioning
          # profile'ı oluşturur.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          # Her TestFlight upload'u benzersiz build number ister.
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          echo "Using build number $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Build iOS (signed IPA)
        script: |
          # --export-options-plist KRİTİK: Flutter'ın "development certificate"
          # arayan otomatik imza kontrolünü atlatır; use-profiles'in ürettiği
          # distribution export ayarını ($HOME/export_options.plist) kullanır.
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - nazantrhs@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # İÇ TEST (internal) — VARSAYILAN, en hızlı yol:
        # beta_groups YOK → build TestFlight'a yüklenir; ASC'de eklediğin İÇ
        # test kullanıcıları build'i incelemesiz, birkaç dakikada görür.
        #
        # DIŞ TEST (external) — başkalarını davet etmek istersen:
        #   1) ASC → TestFlight → External Testing → 'Jetta Beta' grubunu yarat.
        #   2) Test Information'ı doldur (Feedback Email + Beta App Review bilgileri).
        #   3) Aşağıdaki iki satırı aç:
        # beta_groups:
        #   - 'Jetta Beta'
